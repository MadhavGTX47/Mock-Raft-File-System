syntax = "proto3";

package raft;

// ==========================================
// CLIENT -> SERVER SERVICE
// ==========================================
service TelemetryService {
  // Streams mass spectrometry data from the host PC to the Raft Leader
  rpc StreamTelemetry (TelemetryPayload) returns (TelemetryResponse);
}

// The data packet sent by the Mass Spec Host PC
message TelemetryPayload {
  int64 timestamp = 1;         // Epoch timestamp in microseconds
  string data_payload = 2;     // The actual scan data (or float array)
  string sha256_hash = 3;      // SHA-256 checksum for data integrity
}

// The server's response to the client
message TelemetryResponse {
  bool success = 1;            // True if cluster successfully committed the write
  string redirect_leader_ip = 2; // If success is false, this contains the correct leader's IP
  string error_message = 3;    // If something goes wrong
}

// ==========================================
// SERVER -> SERVER (RAFT CONSENSUS) SERVICE
// ==========================================
service RaftConsensus {
  // Invoked by candidates to gather votes during elections
  rpc RequestVote (VoteRequest) returns (VoteResponse);

  // Invoked by the leader to replicate log entries and act as a heartbeat
  rpc AppendEntries (AppendEntriesRequest) returns (AppendEntriesResponse);
}

// Request sent by a Candidate node to request a vote
message VoteRequest {
  int32 term = 1;             // Candidate's term
  int32 candidate_id = 2;     // ID of the candidate requesting vote
  int32 last_log_index = 3;   // Index of candidate's last log entry
  int32 last_log_term = 4;    // Term of candidate's last log entry
}

// Response sent back to the Candidate
message VoteResponse {
  int32 term = 1;             // Current term, for candidate to update itself
  bool vote_granted = 2;      // True means candidate received vote
}

// Request sent by the Leader to replicate log entries
message AppendEntriesRequest {
  int32 term = 1;             // Leader's term
  int32 leader_id = 2;        // So follower can redirect clients
  int32 prev_log_index = 3;   // Index of log entry immediately preceding new ones
  int32 prev_log_term = 4;    // Term of prev_log_index entry
  repeated string entries = 5; // Log entries to store (empty for heartbeats)
  int32 leader_commit = 6;    // Leader's commitIndex
}

// Response sent back to the Leader
message AppendEntriesResponse {
  int32 term = 1;             // Current term, for leader to update itself
  bool success = 2;           // True if follower contained entry matching prev_log_index and prev_log_term
}
